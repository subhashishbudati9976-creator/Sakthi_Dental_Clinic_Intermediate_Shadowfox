<!DOCTYPE html>
<html>
<head><title>Test Local Load</title></head>
<body>
<canvas id="c" width="1920" height="1080" style="width:400px"></canvas>
<div id="status">Testing...</div>
<script>
async function test() {
  const status = document.getElementById('status');
  const results = [];
  
  // Test 1: Image element + decode()
  try {
    const t0 = performance.now();
    const img = new Image();
    img.src = '../assets/character_frames/frame_0000.webp';
    await img.decode();
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    results.push(`Image.decode: SUCCESS in ${(performance.now() - t0).toFixed(1)}ms`);
    
    // Test createImageBitmap from Image element
    try {
      const bmp = await createImageBitmap(img);
      ctx.drawImage(bmp, 0, 0);
      bmp.close();
      results.push('createImageBitmap(img): SUCCESS');
    } catch(e) {
      results.push('createImageBitmap(img): ' + e.message);
    }
  } catch(e) {
    results.push('Image.decode: ' + e.message);
  }

  // Test 2: fetch()
  try {
    const t0 = performance.now();
    const res = await fetch('../assets/character_frames/frame_0000.webp');
    const blob = await res.blob();
    const bmp = await createImageBitmap(blob);
    results.push(`fetch + createImageBitmap(blob): SUCCESS in ${(performance.now() - t0).toFixed(1)}ms`);
    bmp.close();
  } catch(e) {
    results.push('fetch: ' + e.message);
  }

  status.innerHTML = results.join('<br>');
  console.log('Results:', results);
}
test();
</script>
</body>
</html>
